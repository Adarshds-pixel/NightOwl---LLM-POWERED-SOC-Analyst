[pytest]
pythonpath = .
testpaths = tests
# Integration tests download models or need the built knowledge base
# (ai/tools/build_kb.py); the default run is fully offline.
# Run them explicitly with: pytest -m integration
addopts = -m "not integration"
markers =
    use_ml_detector: run this test against the real trained ML anomaly detector instead of disabling it (see tests/conftest.py::_disable_ml_detector)
    integration: needs network/model downloads or the built knowledge base; excluded from the default run
    slow: runs the real detection pipeline over the full EVTX corpus
