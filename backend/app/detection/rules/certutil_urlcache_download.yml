title: Certutil Download via urlcache/split Flags
id: 8c2e5f11-4a3b-4d7e-9c1a-6b5e2f8a7d33
status: experimental
description: >
  Detects certutil.exe invoked with -urlcache or -split, a well-known
  LOLBin technique for downloading a remote file without a dedicated
  download tool.
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-08-18
references:
  - https://attack.mitre.org/techniques/T1105/
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  category: process_creation
detection:
  selection:
    Image|contains: certutil.exe
    CommandLine|contains:
      - '-urlcache'
      - '-split'
  condition: selection
level: high
