title: File Creation Timestamp Backdated (Timestomping)
id: 49c6ddee-506c-4b31-9370-57437f62a3cf
status: experimental
description: >
  Detects a file's creation timestamp being changed to a value earlier
  than its previous creation time (Sysmon Event ID 2). Malware commonly
  "timestomps" dropped files to blend in with legitimate system files or
  to defeat timeline-based forensic analysis. The comparison itself is
  done in the normalizer (app/ingestion/normalizer.py::_flag_timestomp),
  since this rule engine only supports literal-value matching, not
  cross-field comparison -- this rule just checks the resulting flag.

  Tactic tags follow the pinned ATT&CK v19.2 dataset, which retired the
  defense-evasion tactic (split into stealth and defense-impairment); the
  loader rejects a tactic tag that is not a tactic of the rule's
  technique.

  Windows Installer, servicing and OneDrive set file creation times as
  part of normal installs/sync and are excluded; archive tools and
  browsers can still produce benign hits, so treat this as supporting
  evidence.
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-09-04
references:
  - https://attack.mitre.org/techniques/T1070/006/
tags:
  - attack.stealth
  - attack.t1070.006
logsource:
  category: file_change
  service: sysmon
detection:
  selection:
    TimestompSuspected: 'true'
  filter_installers:
    Image|endswith:
      - '\msiexec.exe'
      - '\TiWorker.exe'
      - '\TrustedInstaller.exe'
      - '\OneDrive.exe'
      - '\OneDriveSetup.exe'
  condition: selection and not filter_installers
level: medium
