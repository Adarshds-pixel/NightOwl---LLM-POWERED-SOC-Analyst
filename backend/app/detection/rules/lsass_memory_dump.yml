title: LSASS Memory Dump
id: 267ca9a6-bc8a-4ff6-8a19-1039c976ecab
status: experimental
description: >
  Detects tooling commonly used to dump LSASS process memory to disk to
  later extract credentials offline (procdump against lsass.exe, or
  rundll32.exe invoking comsvcs.dll's MiniDump export).

  The comsvcs branch requires BOTH comsvcs.dll and its MiniDump export
  (by name or ordinal #24). It used to match the word MiniDump anywhere,
  which fired 13 times at critical severity on ChatGPT's crash-reporter
  (`--type=crashpad-handler ... MiniDump`) in benign data. `procdump` now
  also matches procdump64.exe.
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-08-19
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  service: sysmon
detection:
  selection_procdump:
    Image|contains: 'procdump'
    CommandLine|contains: 'lsass'
  selection_comsvcs:
    CommandLine|contains: 'comsvcs'
  selection_comsvcs_export:
    CommandLine|contains:
      - 'MiniDump'
      - '#24'
      - '#+24'
  condition: selection_procdump or (selection_comsvcs and selection_comsvcs_export)
level: high
