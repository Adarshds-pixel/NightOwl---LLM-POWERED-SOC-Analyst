title: Registry IFEO Debugger Hijack
id: 5e8c1f34-7a2d-4b9e-9c6f-3d1a8e5b7c92
status: experimental
description: >
  Detects a "Debugger" value being set under an Image File Execution
  Options (IFEO) key, which redirects execution of the target binary to
  an attacker-controlled program instead -- used for persistence and
  defense evasion.
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-08-19
references:
  - https://attack.mitre.org/techniques/T1546/012/
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.defense_evasion
  - attack.t1546.012
logsource:
  category: registry_event
detection:
  selection:
    TargetObject|contains: '\Image File Execution Options\'
    TargetObject|endswith: '\Debugger'
  condition: selection
level: high
