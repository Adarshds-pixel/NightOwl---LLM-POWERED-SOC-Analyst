title: Suspicious Mshta Execution
id: 1a6d3e78-4f9c-4b2e-8a1d-7c5b3f9e6d24
status: experimental
description: >
  Detects mshta.exe (a signed, trusted Windows binary for running HTML
  Applications) being invoked with a remote URL or inline script -- a
  common LOLBin technique for executing attacker code while evading
  binary-allowlisting controls.

  Tactic tags follow the pinned ATT&CK v19.2 dataset, which retired the
  defense-evasion tactic (split into stealth and defense-impairment); the
  loader rejects a tactic tag that is not a tactic of the rule's
  technique.
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-08-19
references:
  - https://attack.mitre.org/techniques/T1218/005/
tags:
  - attack.stealth
  - attack.t1218.005
logsource:
  category: process_creation
  service: sysmon
detection:
  selection_image:
    - Image|endswith: '\mshta.exe'
    - OriginalFileName: 'MSHTA.EXE'
  selection_payload:
    CommandLine|contains:
      - 'http'
      - '.hta'
      - 'javascript:'
      - 'vbscript:'
      - 'about:'
  condition: selection_image and selection_payload
level: high
