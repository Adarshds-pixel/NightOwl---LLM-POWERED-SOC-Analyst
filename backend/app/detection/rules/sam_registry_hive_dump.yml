title: SAM/SYSTEM/SECURITY Registry Hive Dump
id: 325fa5ce-53ab-4ad5-b12d-fd2043fb786b
status: experimental
description: >
  Detects reg.exe being used to save the SAM, SYSTEM, or SECURITY registry
  hives to a file, a common precursor to offline credential extraction.

  Matches the long-form HKEY_LOCAL_MACHINE path and `reg export` as well
  as `reg save`.
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-08-19
references:
  - https://attack.mitre.org/techniques/T1003/002/
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  category: process_creation
  service: sysmon
detection:
  selection_image:
    - Image|endswith: '\reg.exe'
    - OriginalFileName: 'reg.exe'
  selection_action:
    CommandLine|contains:
      - ' save '
      - ' export '
  selection_target:
    CommandLine|re: '(?i)(hklm|hkey_local_machine)\\(sam|system|security)\b'
  condition: selection_image and selection_action and selection_target
level: high
