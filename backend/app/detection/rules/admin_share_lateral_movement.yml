title: Lateral Movement via Windows Admin Share
id: 2a809450-11dc-4713-b174-a6a7fb0592da
status: experimental
description: >
  Detects net.exe/net1.exe being used to connect to a remote host's
  administrative share (ADMIN$/IPC$), a common step for lateral movement
  and remote tool deployment (e.g. PsExec-style tooling).

  Matches net.exe / net1.exe exactly (`contains: net.exe` also matched
  dotnet.exe) and every admin share including drive shares such as C$,
  which the previous version missed.
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-08-19
references:
  - https://attack.mitre.org/techniques/T1021/002/
tags:
  - attack.lateral_movement
  - attack.t1021.002
logsource:
  category: process_creation
  service: sysmon
detection:
  selection_image:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
  selection_admin_share:
    CommandLine|re: '(?i)\\\\[^\\\s]+\\(admin|ipc|[a-z])\$'
  condition: selection_image and selection_admin_share
level: medium
