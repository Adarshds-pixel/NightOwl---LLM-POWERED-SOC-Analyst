title: Accessibility Feature Hijack (Shell or Tool Spawned via Accessibility Binary)
id: 7653de6e-fb41-40be-8ba1-349444409b4a
status: experimental
description: >
  Detects abuse of the Windows accessibility binaries (Sticky Keys,
  On-Screen Keyboard, Utility Manager...) to get a shell at the logon
  screen: an accessibility binary spawning a shell or recon tool,
  winlogon / utilman launching a shell directly (the Image File Execution
  Options 'Debugger' variant), or an accessibility binary that is really
  cmd.exe/PowerShell under its original file name (the binary-replacement
  variant). Utilman starting osk.exe and winlogon starting sethc.exe on
  their own are what these features normally do -- the previous version
  alerted on exactly that and fired on the Sticky Keys prompt in benign
  data. Verified against real content:
  persistence_accessibility_features_osk_sysmon1.evtx (osk.exe launched
  through `utilman.exe /debug`, then spawning whoami.exe).
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-09-04
references:
  - https://attack.mitre.org/techniques/T1546/008/
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1546.008
logsource:
  category: process_creation
  service: sysmon
detection:
  selection_child_of_accessibility:
    ParentImage|endswith:
      - '\osk.exe'
      - '\sethc.exe'
      - '\utilman.exe'
      - '\magnify.exe'
      - '\narrator.exe'
      - '\displayswitch.exe'
      - '\atbroker.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\whoami.exe'
      - '\net.exe'
      - '\net1.exe'
      - '\rundll32.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\reg.exe'
  selection_shell_at_logon_screen:
    ParentImage|endswith:
      - '\winlogon.exe'
      - '\utilman.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_replaced_binary:
    Image|endswith:
      - '\osk.exe'
      - '\sethc.exe'
      - '\utilman.exe'
      - '\magnify.exe'
      - '\narrator.exe'
    OriginalFileName:
      - 'Cmd.Exe'
      - 'PowerShell.EXE'
      - 'pwsh.dll'
  condition: 1 of selection_*
level: medium
