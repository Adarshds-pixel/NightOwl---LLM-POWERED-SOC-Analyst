title: WMIC Used with Explicit Credentials Against a Remote Host
id: 8d2c5f71-0b3e-4a96-9f48-1e7a6d3c5b29
status: experimental
description: >
  Detects Security event 4648 (logon with explicit credentials) raised by
  WMIC.exe for a remote target server -- `wmic /node:<host>
  /user:<account> process call create ...`, a common way to execute
  commands remotely. Verified against real content:
  LM_WMIC_4648_rpcss.evtx.
author: NightOwl
date: 2026-10-07
references:
  - https://attack.mitre.org/techniques/T1047/
tags:
  - attack.execution
  - attack.t1047
logsource:
  category: explicit_credential_logon
  service: security
detection:
  selection:
    ProcessName|endswith: '\wmic.exe'
  filter_local:
    TargetServerName:
      - 'localhost'
      - '-'
  condition: selection and not filter_local
level: medium
