title: User Account Created with a Computer-Style ($) Name
id: 8c2e6a41-4f9b-4d3e-a17c-6b5d9e2f0a13
status: experimental
description: >
  Detects Security event 4720 (a USER account was created) whose name
  ends in `$` -- the suffix Windows reserves for computer accounts. A
  user account dressed up as a machine account hides among the hundreds
  of real ones in AD consoles and in `net user` output. Real computer
  accounts are created with event 4741 (see
  computer_account_created_by_user.yml); this rule was previously titled
  'Computer Account Created', which described a different event. Verified
  against real content: DE_Fake_ComputerAccount_4720.evtx (an anonymised
  capture whose account name is literally `$`).
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-09-05
references:
  - https://attack.mitre.org/techniques/T1136/002/
  - https://attack.mitre.org/techniques/T1078/002/
tags:
  - attack.persistence
  - attack.t1136.002
logsource:
  category: user_account_created
  service: security
detection:
  selection:
    SamAccountName|endswith: '$'
  condition: selection
level: medium
