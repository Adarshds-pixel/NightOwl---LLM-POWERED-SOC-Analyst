title: PowerShell Fake Credential Prompt (Phishing)
id: 2b6d8f14-5a3c-4d97-8e1b-9f4c6a2d0e73
status: experimental
description: >
  Detects Windows Event ID 4104 (PowerShell Script Block Logging) where
  the logged script block calls `$Host.UI.PromptForCredential` (or the
  equivalent `Get-Credential`-style API) and also validates the entered
  password (`ValidateCredentials` or reads `.GetNetworkCredential()`) --
  the combination used to pop a fake "Windows Security" login prompt from
  a running script and immediately check whether the harvested password
  is correct, rather than simply asking for input and moving on. A
  legitimate script prompting for credentials it will actually use
  (installers, remote-session helpers) doesn't typically re-validate them
  against the local machine's own account database inline -- that
  specific pairing is the phishing tell. Verified against real content:
  `phish_windows_credentials_powershell_scriptblockLog_4104.evtx` --
  `Invoke-LoginPrompt` calls `$Host.ui.PromptForCredential("Windows
  Security", "Please enter user credentials", ...)` in a loop, validating
  each attempt via
  `PrincipalContext.ValidateCredentials()` and re-prompting on failure.
  Checked the other 2 real 4104 samples (an LSASS dumper, an Emotet
  downloader) as involuntary benign look-alikes: neither references
  `PromptForCredential` or credential validation at all.

  Scope note: Get-Credential is deliberately NOT matched --
  administrative scripts call it constantly. This rule targets the
  $Host.UI.PromptForCredential + credential-validation pattern phishing
  scripts use.
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-09-05
references:
  - https://attack.mitre.org/techniques/T1056/002/
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.credential_access
  - attack.collection
  - attack.t1056.002
logsource:
  category: script_block_logging
  service: powershell
detection:
  selection_prompt:
    ScriptBlockText|contains: 'PromptForCredential'
  selection_validate:
    ScriptBlockText|contains:
      - 'ValidateCredentials'
      - 'NetworkCredential'
  condition: selection_prompt and selection_validate
level: high
