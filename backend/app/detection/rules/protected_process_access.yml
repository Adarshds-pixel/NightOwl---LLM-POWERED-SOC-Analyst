title: Suspicious LSASS Process Memory Access
id: 806ea242-4d35-4cc6-8888-deb768d55aed
status: experimental
description: >
  Detects a process outside the Windows system directories and Defender
  opening lsass.exe with an access mask that allows reading its memory
  (the credential-dumping step of Mimikatz-style tools, T1003.001). The
  previous version also covered smss/csrss/winlogon/wininit, which hold
  no credentials, and accepted any source process, so routine access by
  Defender, WMI and Task Manager alerted at critical severity. A
  non-system tool reading lsass memory is still worth review even when it
  turns out to be a third-party AV agent.
author: NightOwl (Pair 1 -- Adarsh + Lisha)
date: 2026-09-04
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  service: sysmon
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|endswith:
      - '1010'
      - '1410'
      - '1438'
      - '143a'
      - '1fffff'
      - '1f3fff'
      - '1f0fff'
  filter_system:
    SourceImage|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
      - 'C:\ProgramData\Microsoft\Windows Defender\'
      - 'C:\Program Files\Windows Defender'
  filter_system_exact:
    SourceImage|endswith:
      - '\MsMpEng.exe'
      - '\MRT.exe'
  condition: selection and not 1 of filter_*
level: high
