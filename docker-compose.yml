# One-command deployment: `docker compose up --build`.
# Required in .env first: ADMIN_PASSWORD_HASH, SESSION_SECRET_KEY,
# POSTGRES_PASSWORD (and GROQ_API_KEY for explanations/chat). The backend runs
# with APP_ENV=production here and refuses to start with a short
# SESSION_SECRET_KEY, a non-bcrypt ADMIN_PASSWORD_HASH, or a weak
# POSTGRES_PASSWORD (under 12 characters or an example value).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nightowl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nightowl}
    ports:
      # Bound to loopback only: the database is for the backend container and
      # local tooling, never the network. Host port 5433 avoids colliding with
      # a Postgres already on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nightowl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network Postgres is "db:5432", not localhost:5433.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nightowl}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nightowl}
      # Never taken from .env: .env sets APP_ENV=local for bare-metal dev runs,
      # and inheriting it here silently turned off the production checks, the
      # Secure cookie flag and the hidden /docs (19 Oct 2026 audit, F-01).
      APP_ENV: production
      # The browser origin the frontend is served from (port mapping below).
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      # Named volumes (owned by the image's non-root user) so the knowledge
      # base and the embedding-model download persist across restarts and
      # rebuilds instead of being re-fetched. The ATT&CK index ships inside
      # the image (backend/app/mitre/data).
      - kb_store:/app/ai/vector_store
      - model_cache:/home/appuser/.cache
    ports:
      # Loopback only by default: the API speaks plain HTTP, so on the network
      # it would carry the admin password and session cookie in clear text.
      # Network access belongs behind a TLS reverse proxy (docs/DOCUMENTATION.md).
      - "${API_BIND:-127.0.0.1}:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the static bundle at build time: the URL the *browser*
        # uses to reach the backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${UI_BIND:-127.0.0.1}:5173:80"

  # Nightly database dumps to ./backups on the host, newest BACKUP_KEEP kept
  # (deploy/backup.sh). Restore: docs/DOCUMENTATION.md "Backups and restore".
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-nightowl}
      PGDATABASE: ${POSTGRES_DB:-nightowl}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]

volumes:
  postgres_data:
  kb_store:
  model_cache:
