# One-command deployment: `docker compose up --build`.
# Required in .env first: ADMIN_PASSWORD_HASH, SESSION_SECRET_KEY,
# POSTGRES_PASSWORD (and GROQ_API_KEY for explanations/chat). The backend
# refuses to start with an empty or short SESSION_SECRET_KEY outside APP_ENV=local.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nightowl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nightowl}
    ports:
      # Bound to loopback only: the database is for the backend container and
      # local tooling, never the network. Host port 5433 avoids colliding with
      # a Postgres already on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nightowl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network Postgres is "db:5432", not localhost:5433.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nightowl}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nightowl}
      APP_ENV: ${APP_ENV:-production}
      # The browser origin the frontend is served from (port mapping below).
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      # Named volumes (owned by the image's non-root user) so the knowledge
      # base and the embedding-model download persist across restarts and
      # rebuilds instead of being re-fetched. The ATT&CK index ships inside
      # the image (backend/app/mitre/data).
      - kb_store:/app/ai/vector_store
      - model_cache:/home/appuser/.cache
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the static bundle at build time: the URL the *browser*
        # uses to reach the backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
  kb_store:
  model_cache:
