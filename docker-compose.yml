services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nightowl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nightowl}
      POSTGRES_DB: ${POSTGRES_DB:-nightowl}
    ports:
      # Host port 5433 (not 5432) — this machine already has another,
      # unrelated Postgres process bound to 5432; avoid colliding with it.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nightowl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides .env's host-relative DATABASE_URL (localhost:5433) --
      # inside the compose network, Postgres is reachable at the service
      # name "db" on its container-internal port 5432, not localhost:5433
      # (host-machine-only).
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nightowl}:${POSTGRES_PASSWORD:-nightowl}@db:5432/${POSTGRES_DB:-nightowl}
    volumes:
      # Mirrors app/mitre/loader.py + app/rag/chroma_client.py's expected
      # `<repo root>/ai` path (resolved via Path(__file__).parents[3]).
      - ./ai:/app/ai
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the static bundle at build time (see frontend/Dockerfile's
        # own comment) -- "backend" is this compose network's service name,
        # reachable from the browser via the port mapping below, not from
        # inside the frontend container itself.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_API_KEY: ${VITE_API_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
