# Weekly dependency update PRs (19 Oct 2026 audit, F-08). Minor and patch
# updates are grouped into one PR per ecosystem to keep the noise down; each
# PR runs the full test workflow before anything is merged. scikit-learn is
# ignored: it must match the version the committed ML models were trained
# with (backend/requirements.txt), so it is bumped only together with a retrain.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: scikit-learn

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
