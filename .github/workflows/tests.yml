name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No SETUPTOOLS_USE_DISTUTILS=stdlib here: Python 3.13 has no stdlib
      # distutils, so that setting makes setuptools unimportable and the build
      # of hexdump (a source-only dependency of python-evtx) fails with
      # "Cannot import 'setuptools.build_meta'".
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build knowledge base
        working-directory: .
        run: python ai/tools/build_kb.py

      - name: Run pytest (offline suite)
        run: python -m pytest -v

      - name: Run integration tests (models + knowledge base)
        run: python -m pytest -v -m integration

      # Security gates (19 Oct 2026 audit, F-08), run against the installed
      # environment so transitive dependencies are audited too.
      - name: Install security tools
        run: pip install pip-audit==2.10.1 bandit==1.9.4

      # Ignored advisories are not reachable in NightOwl:
      #   chromadb (PYSEC-2026-311, -3813, -3814, -3815) need Chroma's HTTP
      #   server; NightOwl only uses the in-process PersistentClient
      #   (app/rag/chroma_client.py). diskcache (PYSEC-2026-2447, via pySigma)
      #   needs write access to its cache directory. Revisit when fixes ship.
      - name: Dependency audit (pip-audit)
        run: >-
          pip-audit --progress-spinner off
          --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-2447

      - name: Static analysis (bandit, medium and above)
        run: bandit -r app ../ai/tools -ll -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (runtime packages)
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build