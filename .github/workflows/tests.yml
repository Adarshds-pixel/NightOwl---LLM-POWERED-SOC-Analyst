name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        # SETUPTOOLS_USE_DISTUTILS=stdlib works around python-evtx's
        # `hexdump` sub-dependency hitting a setuptools/distutils conflict
        # (documented in docs/05_NightOwl_Manual_Testing_Guide.md).
        env:
          SETUPTOOLS_USE_DISTUTILS: stdlib
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v
