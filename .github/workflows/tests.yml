name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No SETUPTOOLS_USE_DISTUTILS=stdlib here: Python 3.13 has no stdlib
      # distutils, so that setting makes setuptools unimportable and the build
      # of hexdump (a source-only dependency of python-evtx) fails with
      # "Cannot import 'setuptools.build_meta'".
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build knowledge base
        working-directory: .
        run: python ai/tools/build_kb.py

      - name: Run pytest (offline suite)
        run: python -m pytest -v

      - name: Run integration tests (models + knowledge base)
        run: python -m pytest -v -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build